name: apps script

on:
  push:
    branches: [main]
    paths: ['apps-script/**', '.github/workflows/apps-script.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Push and deploy
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
          WORKCAL_ID: ${{ secrets.WORKCAL_ID }}
        run: |
          exec > >(tee /tmp/gs.log) 2>&1
          if [ -z "$CLASPRC" ]; then echo "CLASPRC_JSON secret is missing"; exit 1; fi
          npm i -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC" > ~/.clasprc.json
          mkdir work && cd work
          echo '{"scriptId":"1Ikk6lu_f3ODy0fZp7AWZEmNlybNIsVEMtyZSWtyw3lqkGfA4SMasg-vG"}' > .clasp.json
          clasp pull
          ls -la
          # 지금 배포된 코드에서 시트 ID를 가져와 새 코드에 채움
          SHEET_ID=$(grep -oP "SPREADSHEET_ID = '\K[^'_][^']+" WebappAPI.js | head -1)
          if [ -z "$SHEET_ID" ]; then echo "sheet id not found"; exit 1; fi
          sed "s/__SHEET_ID__/$SHEET_ID/; s/__WORKCAL_ID__/$WORKCAL_ID/" ../apps-script/WebappAPI.js > WebappAPI.js
          grep -c "__SHEET_ID__" WebappAPI.js && exit 1 || true
          clasp push -f
          clasp deploy -i AKfycbzKAlhhA02RpnXPVrTLIDrfpQooM2OGlV4jQaNgzrG4tZav9ir84K8nxsr6saQVPT_d -d "auto ${{ github.run_number }}"
          # (임시) 작업캘린더 모양만 확인 - 글 내용 없음
          sleep 5
          curl -sL "https://script.google.com/macros/s/AKfycbzKAlhhA02RpnXPVrTLIDrfpQooM2OGlV4jQaNgzrG4tZav9ir84K8nxsr6saQVPT_d/exec?mode=workcal_shape&gid=1831203006" > /tmp/shape.json || true

      - name: Save log
        if: always()
        run: |
          cp /tmp/gs.log /tmp/keep.log 2>/dev/null || echo "no log" > /tmp/keep.log
          sed -i -E 's/(ya29|1\/\/)[A-Za-z0-9._-]+/[hidden]/g' /tmp/keep.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan gs-log
          git rm -rf --cached . > /dev/null
          cp /tmp/keep.log gs.log
          cp /tmp/shape.json shape.json 2>/dev/null || true
          git add gs.log shape.json 2>/dev/null || git add gs.log
          git commit -m "gs log ${{ github.run_number }}"
          git push -f origin gs-log
