name: android widget

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-widget.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk ../timetracker-widget.apk

      - name: Save build log (on failure)
        if: failure()
        run: |
          cp android/build.log /tmp/build.log || echo "no log" > /tmp/build.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin build-log

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: widget-v${{ github.run_number }}
          name: 타임트래커 위젯 v${{ github.run_number }}
          body: 폰에서 timetracker-widget.apk 를 눌러 설치하세요.
          files: timetracker-widget.apk
          make_latest: true
